{% extends "area_usuario/base.html" %}
{% load static %}

{% block title %}Dashboard - GoodFilms{% endblock %}

{% block extra_head %}
<style>
    .card-indicator {
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
        transition: 0.3s;
    }
    .card-indicator:hover {
        transform: translateY(-5px);
    }
    .icon-box {
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f2f5;
        border-radius: 50%;
        font-size: 1.5rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="row mb-5">
    <div class="col-md-3">
        <div class="card card-indicator p-3">
            <div class="d-flex align-items-center">
                <div class="icon-box me-3"><i class="fas fa-heart text-danger"></i></div>
                <div>
                    <small>Favoritos</small>
                    <h4>{{ total_favoritos|default:'-' }}</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card card-indicator p-3">
            <div class="d-flex align-items-center">
                <div class="icon-box me-3"><i class="fas fa-star text-warning"></i></div>
                <div>
                    <small>Avaliacoes</small>
                    <h4>{{ total_avaliacoes|default:'-' }}</h4>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
